/* ══ SCORE ENGINE ════════════════════════════════════════ */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const initials=n=>n.trim().split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'?';

function calcScore(p){
  const wts=W[p.type]||W.Friendship;let ws=0,wt=0;
  DIMS.forEach(({key})=>{ws+=(p.scores[key]??5)*(wts[key]??1);wt+=(wts[key]??1);});
  let base=(ws/wt)*10;
  const d=p.digital||{};
  if(d.has_data){
    const dv=DIGITAL_DIMS.map(x=>d[x.key]??5);
    const dScore=(dv.reduce((a,v)=>a+v,0)/dv.length)*10;
    base=base*0.65+dScore*0.35;
    const oc=d.online_offline_consistency??5;
    if(oc<5)base-=(5-oc)*3;
  }
  const ints=p.interactions||[];const rec=ints.slice(-6);let iMod=0;
  rec.forEach((it,i)=>{
    const r=(i+1)/rec.length;
    if(it.value==='added')iMod+=2.5*r;else if(it.value==='drained')iMod-=3.5*r;
    if(it.feeling==='positive')iMod+=1.5*r;else if(it.feeling==='negative')iMod-=2*r;
    if(it.tone==='manipulative')iMod-=3*r;else if(it.tone==='dismissive')iMod-=2*r;else if(it.tone==='supportive')iMod+=2*r;
    if(it.depth==='deep')iMod+=1.2*r;else if(it.depth==='surface')iMod-=0.6*r;
    if(it.effort==='low')iMod-=1.2*r;else if(it.effort==='high')iMod+=1.5*r;
  });
  base+=Math.max(-22,Math.min(16,iMod));
  base-=Math.min(22,(p.patterns||[]).length*3.5);
  base-=Math.min(32,(p.red_flags||[]).length*5);
  base+=Math.min(14,(p.green_flags||[]).length*1.5);
  return Math.max(0,Math.min(100,Math.round(base)));
}
function calcTrend(p){
  const ints=p.interactions||[];if(ints.length<3)return'Stable';
  const sc=it=>{let s=0;if(it.value==='added')s+=2.5;else if(it.value==='drained')s-=3;if(it.feeling==='positive')s+=1.5;else if(it.feeling==='negative')s-=2;if(it.tone==='manipulative')s-=2.5;else if(it.tone==='supportive')s+=1.5;if(it.effort==='high')s+=1;else if(it.effort==='low')s-=1;return s;};
  const scores=ints.slice(-6).map(sc);const mean=scores.reduce((a,v)=>a+v,0)/scores.length;
  const variance=scores.reduce((a,v)=>a+(v-mean)**2,0)/scores.length;
  if(variance>9&&scores.length>=4)return'Volatile';
  const recent=scores.slice(-3).reduce((a,v)=>a+v,0)/3;const older=scores.slice(0,-3);const omean=older.length?older.reduce((a,v)=>a+v,0)/older.length:recent;
  if(recent>omean+0.7)return'Improving';if(recent<omean-0.7)return'Declining';return'Stable';
}
function getRiskLevel(p){
  const sc=calcScore(p),rf=(p.red_flags||[]).length,pat=(p.patterns||[]).length,tr=calcTrend(p);
  if(sc<30||rf>=5||(tr==='Declining'&&sc<45)||(tr==='Volatile'&&sc<50))return{label:'Critical',color:'#e85555',bg:'rgba(232,85,85,.1)'};
  if(sc<50||rf>=3||pat>=4)return{label:'High',color:'#d97840',bg:'rgba(217,120,64,.1)'};
  if(sc<65||rf>=2||pat>=2)return{label:'Medium',color:'#c9aa71',bg:'rgba(201,170,113,.1)'};
  return{label:'Low',color:'#4dbf72',bg:'rgba(77,191,114,.1)'};
}
function getValueType(p){
  const s=p.scores||{},sc=calcScore(p),gf=p.green_flags||[];
  if(sc<35)return{label:'Toxic',color:'#e85555'};
  const strategic=((s.competence||5)+(s.growth_contribution||5)+(s.reliability||5))/3;
  const emotional=((s.energy_impact||5)+(s.emotional_stability||5)+(s.trustworthiness||5))/3;
  if(strategic>=7.5||gf.includes('Brings opportunities'))return{label:'Strategic',color:'#2ecc9a'};
  if((s.growth_contribution||0)>=7||gf.includes('Supports long-term vision'))return{label:'Developmental',color:'#9060e0'};
  if(emotional>=7||gf.includes('Positive energy'))return{label:'Emotional',color:'#4dbf72'};
  if(sc>=60)return{label:'Social',color:'#38b8d0'};
  return{label:'Neutral',color:'#6a6a8a'};
}
function getDecision(sc){
  if(sc>=80)return{label:'Invest Deeply',color:'#4dbf72',bg:'rgba(77,191,114,.1)',action:'High-value relationship. Prioritize, deepen investment, and be fully reciprocal.'};
  if(sc>=60)return{label:'Maintain',color:'#2ecc9a',bg:'rgba(46,204,154,.1)',action:'Maintain with awareness. Monitor patterns. Avoid over-investing emotionally.'};
  if(sc>=40)return{label:'Limit Exposure',color:'#d97840',bg:'rgba(217,120,64,.1)',action:'Reduce emotional investment. Set firm limits. Reconsider this person\'s role.'};
  return{label:'Distance / Remove',color:'#e85555',bg:'rgba(232,85,85,.1)',action:'Relationship costs exceed value. Create distance or remove from inner circle.'};
}
function getEnergyImpact(p){
  const ints=p.interactions||[];if(!ints.length)return null;
  const n=ints.length,pos=ints.filter(i=>i.value==='added'||i.feeling==='positive').length,neg=ints.filter(i=>i.value==='drained'||i.feeling==='negative').length;
  const neu=Math.max(0,n-pos-neg),pct=v=>Math.round(v/n*100);
  const label=pos/n>0.6?'Net Positive':pos/n<0.35?'Net Negative':'Mixed';
  const color=pos/n>0.6?'#4dbf72':pos/n<0.35?'#e85555':'#c9aa71';
  const totalMins=ints.reduce((a,i)=>a+(i.time_spent||0),0);
  return{positive:pct(pos),negative:pct(neg),neutral:pct(neu),label,color,totalMins};
}
function calcConsistency(p){
  const ints=p.interactions||[];if(ints.length<3)return null;
  const sc=it=>{let s=5;if(it.value==='added')s+=2;else if(it.value==='drained')s-=2;if(it.feeling==='positive')s+=1;else if(it.feeling==='negative')s-=1;return s;};
  const scores=ints.map(sc),mean=scores.reduce((a,v)=>a+v,0)/scores.length,sd=Math.sqrt(scores.reduce((a,v)=>a+(v-mean)**2,0)/scores.length);
  return+(Math.max(0,Math.min(10,10-sd*1.5))).toFixed(1);
}
function detectBias(p){
  const out=[],s=p.scores||{},sc=calcScore(p);
  const recNeg=(p.interactions||[]).slice(-3).filter(i=>i.feeling==='negative'||i.value==='drained').length;
  if((s.energy_impact||5)>=8&&(s.reliability||5)<=4)out.push('Charm overvaluation — high energy score paired with low reliability.');
  if(recNeg>=2&&sc>=60)out.push('Cognitive dissonance — recent interactions are mostly negative yet overall score stays high.');
  if((s.trustworthiness||5)>=8&&(s.reliability||5)<=4)out.push('Trust inflation — trustworthiness scored high but reliability is low.');
  if((p.interactions||[]).length<3&&sc>=70)out.push('Thin data — fewer than 3 interactions logged. Score reflects impression, not evidence.');
  if((p.red_flags||[]).length>=2&&sc>=60)out.push(`${(p.red_flags||[]).length} red flags logged but score stays high. These may be psychologically minimized.`);
  if(calcTrend(p)==='Volatile'&&sc>=65)out.push('Volatile pattern at a high score. Unpredictability is itself a form of unreliability.');
  if((p.patterns||[]).includes('Love bombing')&&sc>=65)out.push('Love bombing detected. Verify score isn\'t a response to emotional intensity.');
  return out;
}
function getStrengths(p){
  const s=p.scores||{};const out=[];
  if((s.trustworthiness||0)>=7)out.push('Highly trustworthy');if((s.reliability||0)>=7)out.push('Consistently reliable');
  if((s.energy_impact||0)>=7)out.push('Positive energy');if((s.growth_contribution||0)>=7)out.push('Supports your growth');
  if((s.integrity||0)>=7)out.push('Strong integrity');if((s.competence||0)>=7)out.push('High competence');
  if((s.emotional_stability||0)>=7)out.push('Emotionally stable');if((s.respect||0)>=7)out.push('Respects boundaries');
  (p.green_flags||[]).slice(0,3).forEach(f=>out.push(f));return[...new Set(out)].slice(0,5);
}
function getRisks(p){
  const s=p.scores||{};const out=[];
  if((s.trustworthiness||10)<=4)out.push('Low trustworthiness');if((s.reliability||10)<=4)out.push('Inconsistent behavior');
  if((s.energy_impact||10)<=4)out.push('Energy-draining');if((s.integrity||10)<=4)out.push('Low integrity');
  if((s.emotional_stability||10)<=4)out.push('Emotional instability');if((s.respect||10)<=4)out.push('Boundary issues');
  (p.red_flags||[]).slice(0,4).forEach(f=>out.push(f));(p.patterns||[]).slice(0,2).forEach(f=>out.push(f));return[...new Set(out)].slice(0,5);
}

async function analyzeWithAI(content){
  const res=await fetch(AI_PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1200,messages:[{role:'user',content:AI_DIGITAL_PROMPT(content)}]})});

  const text=data.content.map(i=>i.text||'').filter(Boolean).join('');

function ScoreArc({score,size=80}){

  return(
    <div style={{position:'relative',width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} style={{transform:'rotate(135deg)'}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.07)" strokeWidth={stroke} strokeDasharray={`${arc} ${c}`} strokeLinecap="round"/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeDasharray={`${fill} ${c-fill}`} strokeLinecap="round" style={{transition:'stroke-dasharray .5s'}}/>

      </div>

}

      <div className="fl fli flb flw g8 mb16">
        <div className="fl flw g4">{types.map(t=><button key={t} className={`ftab${filter===t?' on':''}`} onClick={()=>setFilter(t)}>{t}</button>)}</div>
        <div className="fl g8 fli">
          <select className="fg-sel" style={{width:'auto',fontSize:12,padding:'4px 8px'}} value={sort} onChange={e=>setSort(e.target.value)}><option value="score">Score ↓</option><option value="name">Name A–Z</option><option value="risk">Risk Level</option><option value="trend">Trend</option></select>
          <button className="btn btnp btnsm" onClick={onAdd}>+ Add Person</button>
        </div>
      </div>
      {filtered.length===0?(<div className="empty"><div style={{fontSize:38,marginBottom:12,opacity:.2}}>◈</div><div className="fw6" style={{fontSize:18,marginBottom:6}}>{people.length===0?'Begin Your Intelligence Map':'No profiles in this category'}</div><div className="fd fsm mb20">{people.length===0?'Evaluate people in your life with behavioral precision and psychological depth.':''}</div>{people.length===0&&<button className="btn btnp" onClick={onAdd}>+ Add Your First Person</button>}</div>):(<div className="people-grid">{filtered.map(p=><PCard key={p.id} person={p} onClick={()=>onSelect(p.id)}/>)}</div>)}
    </div>
  );
}

/* ══ PROFILE ════════════════════════════════════════════ */

        <div className="two-col"><div><div className="sec-title">Red Flags ({(person.red_flags||[]).length})</div><div className="tags-row">{(person.red_flags||[]).length===0?<span className="fxs fd">None</span>:(person.red_flags||[]).map((f,i)=><span key={i} className="tag tag-r on">{f}</span>)}</div></div><div><div className="sec-title">Green Flags ({(person.green_flags||[]).length})</div><div className="tags-row">{(person.green_flags||[]).length===0?<span className="fxs fd">None</span>:(person.green_flags||[]).map((f,i)=><span key={i} className="tag tag-g on">{f}</span>)}</div></div></div>
      </div>)}
      {tab==='digital'&&(<div>
        {!d.has_data?(<div className="card" style={{textAlign:'center',padding:'2.5rem 2rem'}}><div style={{fontSize:28,opacity:.2,marginBottom:12}}>◇</div><div className="fw5 mb8">No Digital Profile</div><div className="fsm fd mb16">Add digital presence data to enable score blending and AI content analysis.</div><button className="btn btnp btnsm" onClick={onEdit}>Add Digital Data</button></div>):(
          <div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'.6rem',marginBottom:'1.5rem'}}>{[{l:'Digital Score',v:Math.round((DIGITAL_DIMS.map(x=>d[x.key]??5).reduce((a,v)=>a+v,0)/DIGITAL_DIMS.length)*10)},{l:'Online/Offline Gap',v:`${d.online_offline_consistency}/10`},{l:'Network Quality',v:`${d.network_quality}/10`}].map(({l,v})=>(<div key={l} className="stat-card"><div className="stat-label">{l}</div><div className="stat-val fm" style={{color:sColor(typeof v==='number'?v:(parseFloat(v)/10)*100),fontSize:18}}>{v}</div></div>))}</div>
            {d.mode==='ai'&&d.ai_result&&(<div className="ai-result-header mb16"><div className="fl fli g10"><span className="ai-badge">◈ AI-ANALYZED</span><span className="fxs fd">Analyzed {new Date(d.ai_result.analyzed_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span></div><div className="fl g8 fli"><span className={`conf-badge ${d.ai_result.data_quality==='strong'?'hi':d.ai_result.data_quality==='moderate'?'med':'lo'}`}>{d.ai_result.data_quality} data</span><span className={`conf-badge ${confClass(d.ai_result.overall_confidence)}`}>{d.ai_result.overall_confidence} confidence</span></div></div>)}
            <div className="sec-title">Digital Presence</div>
            <div style={{marginBottom:'1.5rem'}}>{DIGITAL_DIMS.map(dim=>{const isAI=d.mode==='ai'&&d.ai_result,conf=isAI?d.ai_result?.confidence?.[dim.key]:null;return(<div key={dim.key} className="dim-row" style={{marginBottom:'.7rem'}}><div className="dim-label"><div>{dim.label}</div>{isAI&&conf&&<div className="fl g4 mt4"><span className="ai-badge" style={{fontSize:9}}>AI</span><span className={`conf-badge ${confClass(conf)}`} style={{fontSize:9}}>{conf}</span></div>}</div><div className="dim-bar-bg"><div className="dim-bar-fill" style={{width:`${(d[dim.key]??5)*10}%`,background:(d[dim.key]??5)>=7?'#4dbf72':(d[dim.key]??5)>=5?'#2ecc9a':'#e85555'}}/></div><span className="dim-val fm">{d[dim.key]??5}</span></div>);})}</div>
            {(d.online_offline_consistency??5)<5&&(<div className="card-danger mb16"><div className="fxs fr fw5 mb6">Inconsistency Warning</div><div className="fsm fd">Online/offline gap score: {d.online_offline_consistency}/10. Score penalty: −{(5-(d.online_offline_consistency??5))*3} pts.</div></div>)}

          </div>
        )}
      </div>)}
      {tab==='log'&&(<div>
        <div className="fl fli flb mb16"><div><div className="fw5" style={{fontSize:15}}>{(person.interactions||[]).length} Logged Interactions</div>{ei&&<div className="fxs fd mt6">Energy: <span style={{color:ei.color}}>{ei.label}</span>{ei.totalMins>0?` · ${fmtMins(ei.totalMins)} total`:''}</div>}</div><button className="btn btnsm btnp" onClick={onLog}>+ Log</button></div>
        {(person.interactions||[]).length===0?(<div className="card" style={{textAlign:'center',padding:'2rem'}}><div className="fsm fd">No interactions logged yet.</div></div>):(
          <div className="scroll-box">{[...(person.interactions||[])].reverse().map(it=>{const fc=it.feeling==='positive'?'#4dbf72':it.feeling==='negative'?'#e85555':'#6a6a8a',vc=it.value==='added'?'#4dbf72':it.value==='drained'?'#e85555':'#6a6a8a',tc=it.tone==='supportive'?'#4dbf72':it.tone==='manipulative'?'#e85555':it.tone==='dismissive'?'#d97840':'#6a6a8a';const pill=(v,c)=>(<span style={{fontSize:10,color:c,padding:'1px 6px',borderRadius:3,background:`${c}15`,fontFamily:'var(--mono)'}}>{v}</span>);return(<div key={it.id} className="it-item"><div className="fl fli flb mb8"><span className="fxs fm fd">{fmtDate(it.date)}</span><div className="fl g4 flw">{it.tone&&it.tone!=='neutral'&&pill(it.tone,tc)}{pill(it.feeling,fc)}{pill(it.value,vc)}{it.depth&&it.depth!=='moderate'&&pill(it.depth,'#6a6a8a')}{it.effort&&it.effort!=='medium'&&pill(`effort: ${it.effort}`,it.effort==='high'?'#4dbf72':'#e85555')}{it.time_spent>0&&pill(fmtMins(it.time_spent),'#6a6a8a')}</div></div><div className="fsm">{it.summary}</div>{(it.flags||[]).length>0&&<div className="fl g4 mt8 flw">{it.flags.map((f,i)=><span key={i} style={{fontSize:10,color:'#e85555',padding:'1px 5px',borderRadius:3,background:'rgba(232,85,85,.1)'}}>{f}</span>)}</div>}</div>);})}</div>
        )}
      </div>)}
      {tab==='defend'&&<ScoreDefense person={person} score={sc} onSaveDefense={onSaveDefense}/>}
    </div>
  );
}

/* ══ SCORE DEFENSE ═══════════════════════════════════════ */
function ScoreDefense({person,score,onSaveDefense}){
  const[situation,setSituation]=useState(person.defense_log?.slice(-1)[0]?.situation||'');
  const[state,setState]=useState(person.defense_log?.length>0?'done':'idle');
  const[result,setResult]=useState(person.defense_log?.slice(-1)[0]?.result||null);
  const[err,setErr]=useState(null);
  const[saved,setSaved]=useState(false);

  const DEFENSE_PROMPT=(p,sc,sit)=>`You are a senior behavioral psychologist and decision analyst. A user has rated someone in their life and you must challenge and validate that score using strict psychological methodology.

PERSON BEING RATED:
- Name: ${p.name}
- Relationship type: ${p.type}
- Current score: ${sc}/100
- Red flags logged: ${(p.red_flags||[]).join(', ')||'none'}
- Green flags logged: ${(p.green_flags||[]).join(', ')||'none'}
- Behavioral patterns: ${(p.patterns||[]).join(', ')||'none'}
- Interactions logged: ${(p.interactions||[]).length}
- Recent interaction summaries: ${(p.interactions||[]).slice(-3).map(i=>i.summary).join(' | ')||'none'}
- Dimension scores: ${Object.entries(p.scores||{}).map(([k,v])=>k+':'+v).join(', ')}

USER'S DESCRIPTION OF THE SITUATION:
"${sit}"

Run the full 10-step Score Defense Protocol. Return ONLY raw JSON (no markdown, no backticks):

{
  "initial_score": ${sc},
  "corrected_score": <integer 0-100, your corrected overall score>,
  "confidence_level": <integer 0-100, how reliable is this evaluation>,
  "score_change_direction": "<raised|lowered|confirmed>",
  "score_change_reason": "<one clear sentence explaining why score was changed or confirmed>",
  "objective_behavior": "<what actually happened — facts only, no emotions>",
  "subjective_reaction": "<what the user felt — separated from facts>",
  "category_scores": {
    "trustworthiness": {"score": <1-10>, "reason": "<evidence-based one sentence>"},
    "reliability": {"score": <1-10>, "reason": "<evidence-based one sentence>"},
    "emotional_stability": {"score": <1-10>, "reason": "<evidence-based one sentence>"},
    "respect_and_boundaries": {"score": <1-10>, "reason": "<evidence-based one sentence>"},
    "integrity": {"score": <1-10>, "reason": "<evidence-based one sentence>"},
    "energy_impact": {"score": <1-10>, "reason": "<evidence-based one sentence>"},
    "growth_contribution": {"score": <1-10>, "reason": "<evidence-based one sentence>"}
  },
  "why_not_higher": "<what evidence supports keeping score above the initial rating — any positive behaviors observed?>",
  "why_not_lower": "<is there evidence they deserve even lower — repeated patterns or one incident?>",
  "emotional_impact_score": <0-10, how much emotion is involved>,
  "evidence_strength_score": <0-10, how strong is the behavioral evidence>,
  "emotion_exceeded_evidence": <true|false>,
  "pattern_or_incident": "<pattern|incident|unclear>",
  "pattern_analysis": "<is this score based on repeated behavior or a single event? explain>",
  "biases_detected": ["<recency bias|halo effect|horn effect|projection|emotional contamination — list any detected>"],
  "bias_explanation": "<explain each detected bias and how it may have distorted the score>",
  "time_factor": "<recent only|consistent over time|unknown>",
  "final_justification": "<2-3 sentence final verdict — is the score fair, what does the evidence actually say, what should the user do with this information>",
  "action_recommendation": "<one concrete action: keep rating, raise it, lower it, gather more data, set a limit, remove from life, etc.>"
}

Critical rules:
- Emotion can influence score but cannot exceed 30% weight
- Single incident = mark as temporary, penalize less
- If bias detected, recalculate accordingly
- Be honest — if score is too harsh, say so. If too lenient, say so.
- Base everything on behavioral evidence, not assumptions`;

  const run=async()=>{
    if(!situation.trim())return alert('Describe what happened with this person first.');
    setState('loading');setResult(null);setErr(null);
    try{
      const res=await fetch(AI_PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1800,messages:[{role:'user',content:DEFENSE_PROMPT(person,score,situation)}]})});
      if(!res.ok)throw new Error('API error '+res.status);
      const data=await res.json();
      const text=data.content.map(i=>i.text||'').join('');
      const r=JSON.parse(text.replace(/```json|```/g,'').trim());
      setResult(r);setState('done');setSaved(false);
    }catch(e){setErr('Analysis failed: '+e.message);setState('error');}
  };

  const dirColor=r=>r==='raised'?'#4dbf72':r==='lowered'?'#e85555':'#c9aa71';
  const dirLabel=r=>r==='raised'?'↑ Score raised':r==='lowered'?'↓ Score lowered':'→ Score confirmed';

  return(
    <div>
      {/* Intro */}
      <div style={{background:'rgba(201,170,113,.06)',border:'1px solid var(--border-gold)',borderRadius:10,padding:'1rem 1.125rem',marginBottom:'1.5rem'}}>
        <div className="fw6 fg mb6" style={{fontSize:16}}>🛡 Score Defense Protocol</div>
        <div className="fsm fd" style={{lineHeight:1.7}}>Before accepting your rating of <span className="fm fw6" style={{color:sColor(score)}}>{score}/100</span>, this system challenges it using 10 psychological validation steps — separating what happened from what you felt, detecting bias, and rebuilding the score on evidence. No rating is accepted without a defense.</div>
      </div>

      {/* Situation input */}
      <div className="fgroup">
        <label className="flabel">Describe what happened with {person.name}</label>
        <textarea className="fg-ta" style={{minHeight:130,fontSize:15}} value={situation} onChange={e=>{setSituation(e.target.value);if(state==='done'){setState('idle');setResult(null);}}} placeholder={`Be specific and honest. Include:\n• What they did or said\n• How it made you feel\n• Whether this is a pattern or one incident\n• How long you've known them\n\nExample: "She promised to help me with the project but disappeared when I needed her. This has happened 3 times. I feel used but she's always very warm when she wants something."`}/>
      </div>

      <div className="fl fli g12 mb16">
        <button className="btn" style={{background:'rgba(201,170,113,.1)',borderColor:'var(--border-gold)',color:'var(--gold)',opacity:state==='loading'?.55:1,fontSize:15,padding:'.55rem 1.25rem'}} onClick={run} disabled={state==='loading'}>
          {state==='loading'?'Running defense…':state==='done'?'↺ Re-challenge':'⚖ Challenge This Score'}
        </button>
        {state==='done'&&<span className="fxs fg2 fw5">✓ Defense complete</span>}
      </div>

      {state==='loading'&&(
        <div className="ai-thinking mb16">
          <div className="ai-dots"><div className="ai-dot"/><div className="ai-dot"/><div className="ai-dot"/></div>
          <div><div className="fsm fw5 fp">Running 10-step psychological validation…</div><div className="fxs fd mt4">Separating facts from emotions · Checking for bias · Rebuilding score on evidence</div></div>
        </div>
      )}

              <div className="fl fli g6"><span className="fxs fd">Emotion weight:</span><span className="fm fxs" style={{color:result.emotion_exceeded_evidence?'#e85555':'#4dbf72'}}>{result.emotional_impact_score}/10 {result.emotion_exceeded_evidence?'⚠ exceeded 30%':''}</span></div>
            </div>
          </div>

          {/* Facts vs Feelings */}
          <div className="two-col mb16">
            <div className="card" style={{borderColor:'rgba(74,133,232,.2)'}}>
              <div className="fxs fb fw5 mb6">What Actually Happened (Facts)</div>
              <div className="fsm fd" style={{lineHeight:1.7}}>{result.objective_behavior}</div>
            </div>
            <div className="card" style={{borderColor:'rgba(217,120,64,.2)'}}>
              <div className="fxs fo fw5 mb6">What You Felt (Emotion)</div>
              <div className="fsm fd" style={{lineHeight:1.7}}>{result.subjective_reaction}</div>
            </div>
          </div>

          {/* Category breakdown */}
          <div className="mb16">
            <div className="sec-title">Category-by-Category Breakdown</div>
            {result.category_scores&&Object.entries(result.category_scores).map(([k,v])=>(
              <div key={k} style={{marginBottom:'.875rem',padding:'.75rem 1rem',background:'var(--card)',border:'1px solid var(--border)',borderRadius:8}}>
                <div className="fl fli flb mb4">
                  <span className="fsm fw5" style={{textTransform:'capitalize'}}>{k.replace(/_/g,' ')}</span>
                  <span className="fm fw6" style={{color:sColor(v.score*10),fontSize:16}}>{v.score}/10</span>
                </div>
                <div className="fxs fd" style={{lineHeight:1.6}}>{v.reason}</div>
              </div>
            ))}
          </div>

          {/* Pattern vs Incident */}
          <div className="card mb16" style={{borderColor:result.pattern_or_incident==='pattern'?'rgba(232,85,85,.25)':'rgba(201,170,113,.25)'}}>
            <div className="fl fli flb mb6">
              <span className="fsm fw5">Pattern vs Incident</span>
              <span className={`dbadge`} style={{color:result.pattern_or_incident==='pattern'?'#e85555':'#c9aa71',background:result.pattern_or_incident==='pattern'?'rgba(232,85,85,.1)':'rgba(201,170,113,.1)',border:`1px solid ${result.pattern_or_incident==='pattern'?'rgba(232,85,85,.3)':'rgba(201,170,113,.3)'}`}}>{result.pattern_or_incident==='pattern'?'Repeated Pattern':'Single Incident'}</span>
            </div>
            <div className="fsm fd" style={{lineHeight:1.7}}>{result.pattern_analysis}</div>
            <div className="fxs fd mt6">Time factor: <span className="fm" style={{color:'var(--text)'}}>{result.time_factor}</span></div>
          </div>

          {/* Why not higher / lower */}
          <div className="two-col mb16">
            <div className="card">
              <div className="fxs fg2 fw5 mb6">Why Not Higher?</div>
              <div className="fsm fd" style={{lineHeight:1.7}}>{result.why_not_higher}</div>
            </div>
            <div className="card">
              <div className="fxs fr fw5 mb6">Why Not Lower?</div>
              <div className="fsm fd" style={{lineHeight:1.7}}>{result.why_not_lower}</div>
            </div>
          </div>

          {/* Bias detection */}
          {result.biases_detected?.length>0&&(
            <div className="card-warn mb16">
              <div className="fxs fg fw5 mb6">⚠ Biases Detected</div>
              <div className="fl g6 flw mb8">{result.biases_detected.map((b,i)=><span key={i} className="dbadge" style={{color:'#c9aa71',background:'rgba(201,170,113,.1)',border:'1px solid rgba(201,170,113,.25)',fontSize:11}}>{b}</span>)}</div>
              <div className="fsm fd" style={{lineHeight:1.7}}>{result.bias_explanation}</div>
            </div>
          )}

          {/* Final verdict */}
          <div style={{background:'rgba(46,204,154,.06)',border:'1px solid rgba(46,204,154,.25)',borderRadius:10,padding:'1rem 1.125rem'}}>
            <div className="fsm fw6 fg2 mb8">Final Verdict</div>
            <div className="fsm" style={{lineHeight:1.75,marginBottom:'.75rem'}}>{result.final_justification}</div>
            <div style={{background:'rgba(46,204,154,.1)',borderRadius:7,padding:'.6rem .875rem'}}>
              <span className="fxs fw5 fg2">Recommended action: </span>
              <span className="fsm">{result.action_recommendation}</span>
            </div>
          </div>

          {/* Save corrected score */}
          <div className="fl fli g12 mt16">
            {!saved?(
              <button className="btn btnp" style={{fontSize:15,padding:'.65rem 1.4rem'}} onClick={()=>{
                if(onSaveDefense)onSaveDefense(result.corrected_score,situation,result);
                setSaved(true);
              }}>
                💾 Save Corrected Score ({result.corrected_score}) to Profile
              </button>
            ):(
              <div className="fl fli g8">
                <span style={{color:'#4dbf72',fontSize:16}}>✓</span>
                <span className="fsm fg2 fw5">Corrected score saved to profile · Analysis logged</span>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ══ DIGITAL AI PANEL ═══════════════════════════════════ */
function DigitalAIPanel({digital,setDigital}){
  const[inputMode,setInputMode]=useState('text');
  const[paste,setPaste]=useState(digital.ai_result?.content_preview_full||'');
  const[imgSrc,setImgSrc]=useState(digital.ai_result?.img_preview||null);
  const[imgData,setImgData]=useState(null);
  const[imgMime,setImgMime]=useState(null);
  const[state,setState]=useState(digital.ai_result?'done':'idle');
  const[err,setErr]=useState(null);
  const fileRef=React.useRef();

  const quality=paste.length<200?'weak':paste.length<700?'ok':'strong';
  const qualityLabel=paste.length<200?'Short — low confidence expected':paste.length<700?'Moderate sample':'Strong sample';

  const handleImagePick=e=>{
    const file=e.target.files?.[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const result=ev.target.result;
      // Compress image using canvas before storing
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const MAX=800;
        let w=img.width,h=img.height;
        if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        const compressed=canvas.toDataURL('image/jpeg',0.75);
        const base64=compressed.split(',')[1];
        setImgData(base64);
        setImgMime('image/jpeg');
        setImgSrc(compressed);
        setState('idle');
      };
      img.src=result;
    };
    reader.readAsDataURL(file);
  };

  const applyResult=(r,snap,extraFields={})=>{
    setDigital(d=>({...d,mode:'ai',
      social_tone:r.scores.social_tone,content_quality:r.scores.content_quality,
      online_offline_consistency:r.scores.online_offline_consistency,
      lifestyle_signals:r.scores.lifestyle_signals,network_quality:r.scores.network_quality,
      ai_result:{...r,manual_snapshot:snap,analyzed_at:new Date().toISOString(),
        content_preview:paste.slice(0,100),content_preview_full:paste,...extraFields}
    }));
    setState('done');
  };

  const run=async()=>{
    setState('loading');setErr(null);
    const snap={social_tone:digital.social_tone??5,content_quality:digital.content_quality??5,online_offline_consistency:digital.online_offline_consistency??5,lifestyle_signals:digital.lifestyle_signals??5,network_quality:digital.network_quality??5};
    try{
      if(inputMode==='image'){
        if(!imgData)return alert('Please select an image first.');
        const r=await analyzeImageWithAI(imgData,imgMime);
        applyResult(r,snap,{img_preview:imgSrc,source:'image'});
      } else {
        if(!paste.trim())return alert('Paste some content first.');
        const r=await analyzeWithAI(paste);
        applyResult(r,snap,{source:'text'});
      }
    }catch(e){setErr('Analysis failed: '+e.message);setState('error');}
  };

  return(
    <div>
      {/* Input mode tabs */}
      <div className="input-tabs">
        <button className={`input-tab${inputMode==='text'?' on-text':''}`} onClick={()=>setInputMode('text')}>📝 Paste Text</button>
        <button className={`input-tab${inputMode==='image'?' on-img':''}`} onClick={()=>setInputMode('image')}>📸 Analyze Photo</button>
      </div>

      {/* Text input */}
      {inputMode==='text'&&(
        <div className="fgroup">
          <label className="flabel">Paste social media content</label>
          <textarea className="fg-ta" style={{minHeight:150}} value={paste} onChange={e=>setPaste(e.target.value)} placeholder={"Paste posts, captions, bios, tweets, or any public content.\n\nAI extracts tone, personality signals, and lifestyle patterns — then auto-fills scores."}/>
          <div className="paste-counter"><span>{paste.length} characters</span><span className={`paste-quality ${quality}`}>{qualityLabel}</span></div>
        </div>
      )}

      {/* Image input */}
      {inputMode==='image'&&(
        <div className="fgroup">
          <label className="flabel">Upload a photo</label>
          <div className={`img-upload-box${imgSrc?' has-img':''}`} onClick={()=>fileRef.current.click()}>
            {imgSrc?(
              <div>
                <img src={imgSrc} className="img-preview" alt="Selected"/>
                <div className="fxs fd mt8">Tap to change photo</div>
              </div>
            ):(
              <div>
                <div style={{fontSize:36,marginBottom:8}}>📸</div>
                <div className="fw5" style={{marginBottom:4}}>Tap to upload a photo</div>
                <div className="fxs fd">Profile photo, post, screenshot — AI reads body language, environment, lifestyle signals</div>
              </div>
            )}
            <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleImagePick}/>
          </div>
          <div className="fxs fd mt8">Works with profile photos, social posts, screenshots, or any image of the person.</div>
        </div>
      )}

      {/* Analyze button */}
      <div className="fl fli g12 mb16">
        <button className="btn" style={{background:'rgba(144,96,224,.1)',borderColor:'rgba(144,96,224,.3)',color:'#9060e0',opacity:state==='loading'?.55:1,fontSize:15,padding:'.5rem 1.2rem'}} onClick={run} disabled={state==='loading'}>
          {state==='loading'?'Analyzing…':state==='done'?'↺ Re-analyze':`◈ Analyze ${inputMode==='image'?'Photo':'Content'}`}
        </button>
        {digital.ai_result&&state!=='loading'&&(
          <span className="fxs fd">Last: {new Date(digital.ai_result.analyzed_at).toLocaleDateString('en-US',{month:'short',day:'numeric'})} · {digital.ai_result.source==='image'?'📸 Photo':'📝 Text'}</span>
        )}
      </div>

      {state==='loading'&&(
        <div className="ai-thinking mb16">
          <div className="ai-dots"><div className="ai-dot"/><div className="ai-dot"/><div className="ai-dot"/></div>
          <div>
            <div className="fsm fw5 fp">{inputMode==='image'?'Reading visual signals…':'Extracting behavioral signals…'}</div>
            <div className="fxs fd mt4">{inputMode==='image'?'Analyzing body language, environment, lifestyle cues, and social context':'Analyzing tone, personality, content patterns, and lifestyle signals'}</div>
          </div>
        </div>
      )}
      {state==='error'&&err&&(<div className="card-danger mb16"><div className="fxs fr fw5 mb4">Analysis failed</div><div className="fxs fd">{err}</div></div>)}
    </div>
  );
}

  const handleSave=()=>{if(!name.trim())return alert('Please enter a name.');const now=new Date().toISOString();onSave({id:initial?.id||uid(),name:name.trim(),type,color,scores,digital,red_flags:[...rfl],green_flags:[...gfl],patterns:[...pats],interactions:initial?.interactions||[],time_investment:ti,notes,created:initial?.created||now,updated:now});};

      <div className="tab-bar mb16">{SECS.map(s=><button key={s.k} className={`ptab${sec===s.k?' on':''}`} onClick={()=>setSec(s.k)}>{s.l}</button>)}</div>
      {sec==='core'&&(<div className="two-col"><div><div className="fgroup"><label className="flabel">Name</label><input className="fg-inp" value={name} onChange={e=>setName(e.target.value)} placeholder="Full name"/></div><div className="fgroup"><label className="flabel">Relationship Type</label><select className="fg-sel" value={type} onChange={e=>setType(e.target.value)}>{REL_TYPES.map(t=><option key={t} value={t}>{t}</option>)}</select><div className="fxs fd mt8">High-weight: {topW.map(k=>DIMS.find(d=>d.key===k)?.label).join(' · ')}</div></div><div className="fgroup"><label className="flabel">Avatar Color</label><div className="fl g8 flw">{COLORS.map(c=><div key={c} className={`cswatch${color===c?' on':''}`} style={{background:c}} onClick={()=>setColor(c)}/>)}</div></div><div className="fgroup"><label className="flabel">Notes</label><textarea className="fg-ta" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Context, history, key observations..."/></div></div><div><div className="fgroup"><label className="flabel">Time & Effort Investment</label><div className="form-section">{[{k:'hours_per_month',l:'Hours per month',min:0,max:100},{k:'value_received',l:'Value received (1-10)',min:1,max:10},{k:'value_given',l:'Value given (1-10)',min:1,max:10},{k:'emotional_cost',l:'Emotional cost (1-10)',min:1,max:10}].map(({k,l,min,max})=>(<div key={k} style={{marginBottom:'.9rem'}}><div className="fl fli flb mb6"><span className="fxs fd">{l}</span><span className="fm fxs fg">{ti[k]}</span></div><input type="range" min={min} max={max} step="1" value={ti[k]} onChange={e=>setTi(v=>({...v,[k]:+e.target.value}))}/></div>))}</div></div></div></div>)}

 input: <span className="fm">{man}/10</span></span><span className="fxs fd">AI reading: <span className="fm" style={{color:'#9060e0'}}>{ai}/10</span></span></div><div className="fxs fo">Significant difference ({diff} pts). Your direct knowledge overrides the AI — adjust slider if needed.</div></div>);})})</div>):null;})()}{digital.ai_result.signals&&(<div className="signal-box mb12"><div className="fl fli flb mb10"><span className="fxs fg fw5">Extracted Signals</span><span className="ai-badge">AI</span></div>{[{l:'Tone',v:digital.ai_result.signals.tone_summary},{l:'Content',v:digital.ai_result.signals.content_type},{l:'Authenticity',v:digital.ai_result.signals.consistency_pattern},{l:'Environment',v:digital.ai_result.signals.environment_quality}].map(({l,v})=>v&&(<div key={l} className="fl fli flb mb6"><span className="fxs fd">{l}</span><span className="fxs fm" style={{color:'var(--text)',textTransform:'capitalize'}}>{v}</span></div>))}{(digital.ai_result.signals.personality_indicators||[]).length>0&&(<div className="mt8 pt8" style={{borderTop:'1px solid var(--border)'}}><div className="fxs fd mb6">Personality indicators</div><div className="fl g4 flw">{digital.ai_result.signals.personality_indicators.map((p,i)=><span key={i} className="tag tag-b on" style={{fontSize:10}}>{p}</span>)}</div></div>)}</div>)}{(digital.ai_result.warnings||[]).length>0&&(<div className="card mb8" style={{borderColor:'rgba(144,96,224,.2)'}}><div className="fxs fw5 mb6" style={{color:'#9060e0'}}>Could not determine</div>{digital.ai_result.warnings.map((w,i)=><div key={i} className="fxs fd mb4">· {w}</div>)}</div>)}{(digital.ai_result.assumptions||[]).length>0&&(<div className="card-warn"><div className="fxs fg fw5 mb6">Assumptions</div>{digital.ai_result.assumptions.map((a,i)=><div key={i} className="fxs fd mb4">· {a}</div>)}</div>)}</div></div></div>)}

/* ══ LOG INTERACTION ════════════════════════════════════ */
function LogInteraction({person,onSave,onCancel}){
  const[summary,setSummary]=useState('');const[feeling,setFeeling]=useState('neutral');const[value,setValue]=useState('neutral');const[tone,setTone]=useState('neutral');const[depth,setDepth]=useState('moderate');const[effort,setEffort]=useState('medium');const[timeSp,setTimeSp]=useState(30);const[date,setDate]=useState(new Date().toISOString().split('T')[0]);const[flags,setFlags]=useState(new Set());const[addR,setAddR]=useState(new Set());const[addG,setAddG]=useState(new Set());
  const toggleS=(set,fn,v)=>{const c=new Set(set);c.has(v)?c.delete(v):c.add(v);fn(c);};
  const handleSave=()=>{if(!summary.trim())return alert('Please describe the interaction.');onSave({id:uid(),date:new Date(date).toISOString(),summary:summary.trim(),feeling,value,tone,depth,effort,time_spent:timeSp,flags:[...flags]},[...addR],[...addG]);};
  const Sel=({val,label,color,active,onClick})=>(<button className="sel-btn" onClick={onClick} style={{border:`1px solid ${active?color+'55':'var(--border)'}`,background:active?`${color}14`:'transparent',color:active?color:'var(--text2)'}}>{label}</button>);
  const iC=(f,v)=>{const pos={feeling:'positive',value:'added',tone:'supportive',depth:'deep',effort:'high'},neg={feeling:'negative',value:'drained',tone:'manipulative',depth:'surface',effort:'low'};if(v===pos[f])return'#4dbf72';if(v===neg[f])return'#e85555';return'#6a6a8a';};
  const iV=(f,v)=>{const pV={feeling:'+1.5',value:'+2.5',tone:'+2.0',depth:'+1.2',effort:'+1.5'},nV={feeling:'−2.0',value:'−3.5',tone:'−3.0',depth:'−0.6',effort:'−1.2'},pos={feeling:'positive',value:'added',tone:'supportive',depth:'deep',effort:'high'},neg={feeling:'negative',value:'drained',tone:'manipulative',depth:'surface',effort:'low'};if(v===pos[f])return pV[f];if(v===neg[f])return nV[f];return'0.0';};
  return(
    <div>
      <div className="breadcrumb"><span className="blink" onClick={onCancel}>Dashboard</span><span className="bsep">/</span><span className="blink" onClick={onCancel}>{person.name}</span><span className="bsep">/</span><span className="bcur">Log Interaction</span></div>
      <div className="fl fli g12 mb20"><div style={{width:44,height:44,borderRadius:11,background:`${person.color}18`,color:person.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:15,fontWeight:600,flexShrink:0}}>{initials(person.name)}</div><div><div className="fw5" style={{fontSize:15}}>{person.name}</div><div className="fxs fd">Each log updates score, trend, and pattern detection</div></div></div>
      <div className="two-col">
        <div>
          <div className="fgroup"><label className="flabel">Date</label><input type="date" className="fg-inp" value={date} onChange={e=>setDate(e.target.value)}/></div>
          <div className="fgroup"><label className="flabel">What happened?</label><textarea className="fg-ta" style={{minHeight:120}} value={summary} onChange={e=>setSummary(e.target.value)} placeholder="Describe what happened, what was said, how you felt. More detail = better pattern analysis."/></div>
          <div className="fgroup"><label className="flabel">Time Spent</label><div className="fl fli g12"><input type="range" min="0" max="240" step="5" value={timeSp} onChange={e=>setTimeSp(+e.target.value)} style={{flex:1}}/><span className="fm fxs fg" style={{minWidth:40}}>{fmtMins(timeSp)}</span></div></div>
          <div className="fgroup"><label className="flabel">Red Flags in This Interaction</label><div className="tags-row">{RED_FLAGS.map(f=><span key={f} className={`tag tag-r${flags.has(f)?' on':''}`} onClick={()=>toggleS(flags,setFlags,f)}>{f}</span>)}</div></div>
          <div className="fgroup"><label className="flabel">Add to Profile — Red Flags</label><div className="tags-row">{RED_FLAGS.filter(f=>!(person.red_flags||[]).includes(f)).map(f=><span key={f} className={`tag tag-r${addR.has(f)?' on':''}`} onClick={()=>toggleS(addR,setAddR,f)}>{f}</span>)}</div></div>
          <div className="fgroup"><label className="flabel">Add to Profile — Green Flags</label><div className="tags-row">{GREEN_FLAGS.filter(f=>!(person.green_flags||[]).includes(f)).map(f=><span key={f} className={`tag tag-g${addG.has(f)?' on':''}`} onClick={()=>toggleS(addG,setAddG,f)}>{f}</span>)}</div></div>
        </div>
        <div>
          <div className="fgroup"><label className="flabel">How did you feel afterward?</label><div className="fl g8">{[{v:'positive',l:'Positive',c:'#4dbf72'},{v:'neutral',l:'Neutral',c:'#6a6a8a'},{v:'negative',l:'Negative',c:'#e85555'}].map(o=><Sel key={o.v} val={o.v} label={o.l} color={o.c} active={feeling===o.v} onClick={()=>setFeeling(o.v)}/>)}</div></div>
          <div className="fgroup"><label className="flabel">Energy Exchange</label><div className="fl g8">{[{v:'added',l:'Added Value',c:'#4dbf72'},{v:'neutral',l:'Neutral',c:'#6a6a8a'},{v:'drained',l:'Drained Energy',c:'#e85555'}].map(o=><Sel key={o.v} val={o.v} label={o.l} color={o.c} active={value===o.v} onClick={()=>setValue(o.v)}/>)}</div></div>
          <div className="fgroup"><label className="flabel">Their Tone</label><div className="fl flw g6">{[{v:'supportive',l:'Supportive',c:'#4dbf72'},{v:'respectful',l:'Respectful',c:'#2ecc9a'},{v:'neutral',l:'Neutral',c:'#6a6a8a'},{v:'dismissive',l:'Dismissive',c:'#d97840'},{v:'manipulative',l:'Manipulative',c:'#e85555'}].map(o=><Sel key={o.v} val={o.v} label={o.l} color={o.c} active={tone===o.v} onClick={()=>setTone(o.v)}/>)}</div></div>
          <div className="fgroup"><label className="flabel">Conversation Depth</label><div className="fl g6 flw">{[{v:'surface',l:'Surface',c:'#6a6a8a'},{v:'moderate',l:'Moderate',c:'#2ecc9a'},{v:'meaningful',l:'Meaningful',c:'#9060e0'},{v:'deep',l:'Deep',c:'#4dbf72'}].map(o=><Sel key={o.v} val={o.v} label={o.l} color={o.c} active={depth===o.v} onClick={()=>setDepth(o.v)}/>)}</div></div>
          <div className="fgroup"><label className="flabel">Their Effort Level</label><div className="fl g8">{[{v:'low',l:'Low',c:'#e85555'},{v:'medium',l:'Medium',c:'#6a6a8a'},{v:'high',l:'High',c:'#4dbf72'}].map(o=><Sel key={o.v} val={o.v} label={o.l} color={o.c} active={effort===o.v} onClick={()=>setEffort(o.v)}/>)}</div></div>
          <div className="card" style={{background:'rgba(201,170,113,0.05)',borderColor:'var(--border-gold)'}}><div className="fxs fg fw5 mb8">Score impact</div>{[{k:'feeling',v:feeling},{k:'value',v:value},{k:'tone',v:tone},{k:'depth',v:depth},{k:'effort',v:effort}].map(({k,v})=>(<div key={k} className="fl fli flb mb4"><span className="fxs fd" style={{textTransform:'capitalize'}}>{k}</span><span className="fm fxs fw5" style={{color:iC(k,v)}}>{iV(k,v)}</span></div>))}</div>
        </div>
      </div>
      <div className="fl g12 mt16"><button className="btn btnp" onClick={handleSave}>Save Interaction</button><button className="btn" onClick={onCancel}>Cancel</button></div>
    </div>
  );
}

      else{const{error}=await dbSignUp(email,pw);if(error)throw error;setOk('Account created! You can now log in.');}

        {err&&<div className="auth-err">{err}</div>}
        {ok&&<div className="auth-ok">{ok}</div>}
        <div className="fgroup"><label className="flabel">Email</label><input className="fg-inp" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" onKeyDown={e=>e.key==='Enter'&&handle()}/></div>
        <div className="fgroup"><label className="flabel">Password</label><input className="fg-inp" type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder={mode==='signup'?'Min 6 characters':'Your password'} onKeyDown={e=>e.key==='Enter'&&handle()}/></div>

        {mode==='login'&&<div className="auth-hint"><span style={{cursor:'pointer',color:'var(--gold)',textDecoration:'underline',textDecorationColor:'rgba(201,170,113,.3)'}} onClick={handleReset}>Forgot password?</span></div>}

/* ══ QUICK RATE ══════════════════════════════════════════ */
function StarRating({value,onChange}){
  const[hover,setHover]=useState(0);
  const display=hover||value;
  return(
    <div>
      <div className="fl fli" style={{justifyContent:'center',gap:4,padding:'1rem 0',userSelect:'none'}}>
        {[1,2,3,4,5].map(s=>{
          const full=display>=s,half=!full&&display>=s-0.5;
          return(
            <div key={s} style={{position:'relative',width:44,height:44,cursor:'pointer'}}
              onMouseLeave={()=>setHover(0)}
              onClick={e=>{
                const rect=e.currentTarget.getBoundingClientRect();
                const x=e.clientX-rect.left;
                onChange(x<rect.width/2?s-0.5:s);
              }}
              onMouseMove={e=>{
                const rect=e.currentTarget.getBoundingClientRect();
                const x=e.clientX-rect.left;
                setHover(x<rect.width/2?s-0.5:s);
              }}
              onTouchEnd={e=>{
                e.preventDefault();
                const touch=e.changedTouches[0];
                const rect=e.currentTarget.getBoundingClientRect();
                const x=touch.clientX-rect.left;
                onChange(x<rect.width/2?s-0.5:s);
              }}
            >
              <span style={{fontSize:38,position:'absolute',top:0,left:0,filter:'grayscale(1) opacity(0.2)'}}>⭐</span>
              {(full||half)&&(
                <span style={{fontSize:38,position:'absolute',top:0,left:0,clipPath:half?'inset(0 50% 0 0)':'none'}}>⭐</span>
              )}
            </div>
          );
        })}
      </div>
      {value>0&&(
        <div style={{textAlign:'center',color:'var(--gold)',fontSize:16,fontWeight:600,marginTop:4}}>
          {value}★ — {value>=5?'Excellent':value>=4?'Good':value>=3?'Okay':value>=2?'Bad':'Very Bad'}
        </div>
      )}
    </div>
  );
}

  const starsToScore=s=>Math.round(Math.max(1,Math.min(10,s*2)));
  const display=hovered||stars;

  const handleStarClick=(e,i)=>{const rect=e.currentTarget.getBoundingClientRect();const half=(e.clientX-rect.left)<rect.width/2;setStars(half?i-0.5:i);};
  const handleStarHover=(e,i)=>{const rect=e.currentTarget.getBoundingClientRect();const half=(e.clientX-rect.left)<rect.width/2;setHovered(half?i-0.5:i);};

  const NOTE_PROMPT=(n,s,v)=>`You are a behavioral analyst. A ride-share driver wrote this note about a passenger after a trip.

Stars given: ${s}/5
Vibe: ${v}
Note: "${n}"

Based ONLY on the note content, return this exact JSON (no markdown, no backticks):
{
  "score_adjustment": <integer from -20 to +20, how much to adjust the star-based score>,
  "red_flags": [<from this list only: "Manipulation","Dishonesty","Disrespect","Victim mentality","Chronic negativity","Passive aggression","Lack of accountability","Energy-draining conversations","Boundary violations">],
  "green_flags": [<from this list only: "Positive energy","Shows empathy","Respects limits","Consistent behavior","Inspires you","Respects your time","Takes responsibility">],
  "tone": "<supportive|respectful|neutral|dismissive|manipulative>",
  "feeling": "<positive|neutral|negative>",
  "energy": "<added|neutral|drained>",
  "depth": "<surface|moderate|meaningful|deep>",
  "summary": "<one sentence behavioral insight about this person based on the note>",
  "confidence": "<low|medium|high>"
}
Rules: Only use flags clearly supported by the note. Score adjustment: positive note contradicting low stars should raise score; negative note contradicting high stars should lower it. Return empty arrays if no clear flags.`;

  const analyzeNote=async()=>{
    if(!note.trim())return alert('Write a note first, then analyze it.');
    setAiState('loading');setAiResult(null);
    try{
      const res=await fetch(AI_PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:600,messages:[{role:'user',content:NOTE_PROMPT(note,stars||'?',vibe||'?')}]})});
      if(!res.ok)throw new Error('API error '+res.status);
      const data=await res.json();
      const text=data.content.map(i=>i.text||'').join('');
      const r=JSON.parse(text.replace(/```json|```/g,'').trim());
      setAiResult(r);
      setAiState('done');
      // Auto-update vibe if AI strongly disagrees
      if(r.energy==='drained'&&(vibe===''||vibe==='neutral'))setVibe('draining');
      if(r.energy==='added'&&vibe==='')setVibe('pleasant');
    }catch(e){setAiState('error');console.error(e);}
  };

  const handleSave=()=>{
    if(!name.trim())return alert('Enter a name.');
    if(!stars)return alert('Pick a star rating.');
    if(!vibe)return alert('Pick a vibe.');
    const baseSc=starsToScore(stars);
    const adj=aiResult?.score_adjustment||0;
    const sc=Math.max(1,Math.min(10,baseSc+Math.round(adj/10*2)));
    const v=vibes.find(x=>x.k===vibe);
    const feeling=aiResult?.feeling||v.feeling;
    const energy=aiResult?.energy||v.value;
    const tone=aiResult?.tone||v.tone;
    const depth=aiResult?.depth||'surface';
    const now=new Date().toISOString();
    const parts=[];
    if(tripTime)parts.push('Time: '+tripTime);
    if(tripDist)parts.push('Distance: '+tripDist+' km');
    if(tripEarning)parts.push('Earned: '+tripEarning+' JOD');
    if(tripNo)parts.push('Trip #'+tripNo);
    if(tripFrom)parts.push('From: '+tripFrom);
    if(tripTo)parts.push('To: '+tripTo);
    const tripSummary=parts.join(' · ');
    const aiInsight=aiResult?.summary?` — AI: ${aiResult.summary}`:'';
    const summary=`${stars}★ ${v.l}${tripSummary?' — '+tripSummary:''}${note?' — '+note:''}${aiInsight}`;
    // Merge vibe flags with AI flags
    const baseRF=vibe==='rude'?['Disrespect']:vibe==='draining'?['Energy-draining conversations']:[];
    const baseGF=vibe==='great'?['Positive energy','Shows empathy']:vibe==='pleasant'?['Positive energy']:[];
    const aiRF=aiResult?.red_flags||[];
    const aiGF=aiResult?.green_flags||[];
    const person={
      id:uid(),name:name.trim(),type,color,
      scores:{trustworthiness:sc,reliability:sc,emotional_stability:sc,energy_impact:sc,growth_contribution:Math.max(1,sc-2),integrity:sc,competence:sc,respect:sc},
      digital:{has_data:false,mode:'manual',social_tone:5,content_quality:5,online_offline_consistency:5,lifestyle_signals:5,network_quality:5},
      patterns:[],
      red_flags:[...new Set([...baseRF,...aiRF])],
      green_flags:[...new Set([...baseGF,...aiGF])],
      interactions:[{id:uid(),date:now,summary,feeling,value:energy,tone,depth,effort:'medium',time_spent:tripDist?Math.round(parseFloat(tripDist)*2)||10:10,flags:[...new Set([...baseRF,...aiRF])]}],
      time_investment:{hours_per_month:0,value_received:sc,value_given:5,emotional_cost:energy==='drained'?7:3},
      notes:[note,tripSummary,aiResult?.summary].filter(Boolean).join('\n'),
      trip_info:{time:tripTime,distance:tripDist,earning:tripEarning,trip_no:tripNo,from:tripFrom,to:tripTo},
      ai_note_analysis:aiResult||null,
      created:now,updated:now
    };
    onSave(person);
  };

  return(
    <div>
      <div className="breadcrumb"><span className="blink" onClick={onCancel}>Dashboard</span><span className="bsep">/</span><span className="bcur">Quick Rate</span></div>
      <div style={{maxWidth:520,margin:'0 auto'}}>
        <div style={{textAlign:'center',marginBottom:'1.5rem'}}>
          <div className="fw6" style={{fontSize:22,marginBottom:6}}>Quick Rate</div>
          <div className="fd fsm">Name → Trip info → Stars → Vibe → Done</div>
        </div>

        <div className="two-col" style={{marginBottom:'1rem'}}>
          <div className="fgroup" style={{marginBottom:0}}>
            <label className="flabel">Name</label>
            <input className="fg-inp" style={{fontSize:16}} value={name} onChange={e=>setName(e.target.value)} placeholder="Passenger name" autoFocus/>
          </div>
          <div className="fgroup" style={{marginBottom:0}}>
            <label className="flabel">Type</label>
            <select className="fg-sel" value={type} onChange={e=>setType(e.target.value)}>{REL_TYPES.map(t=><option key={t}>{t}</option>)}</select>
          </div>
        </div>

        <div className="card mb16" style={{background:'rgba(201,170,113,0.04)',borderColor:'var(--border-gold)'}}>
          <div className="sec-title" style={{marginBottom:'.875rem'}}>Trip Information <span className="fd" style={{textTransform:'none',letterSpacing:0,fontFamily:'var(--font)',fontSize:12}}>optional</span></div>
          <div className="two-col" style={{gap:'.75rem',marginBottom:'.75rem'}}>
            <div><label className="flabel" style={{marginBottom:4}}>Time</label><input className="fg-inp" style={{fontSize:15}} value={tripTime} onChange={e=>setTripTime(e.target.value)} placeholder="e.g. 11:53 AM"/></div>
            <div><label className="flabel" style={{marginBottom:4}}>Trip No.</label><input className="fg-inp" style={{fontSize:15}} value={tripNo} onChange={e=>setTripNo(e.target.value)} placeholder="e.g. 32419483"/></div>
          </div>
          <div className="two-col" style={{gap:'.75rem',marginBottom:'.75rem'}}>
            <div><label className="flabel" style={{marginBottom:4}}>Distance (km)</label><input className="fg-inp" style={{fontSize:15}} value={tripDist} onChange={e=>setTripDist(e.target.value)} placeholder="e.g. 7.41"/></div>
            <div><label className="flabel" style={{marginBottom:4}}>Earnings (JOD)</label><input className="fg-inp" style={{fontSize:15}} value={tripEarning} onChange={e=>setTripEarning(e.target.value)} placeholder="e.g. 2.02"/></div>
          </div>
          <div style={{marginBottom:'.75rem'}}><label className="flabel" style={{marginBottom:4}}>Pickup Location</label><input className="fg-inp" style={{fontSize:15}} value={tripFrom} onChange={e=>setTripFrom(e.target.value)} placeholder="Where did you pick them up?"/></div>
          <div><label className="flabel" style={{marginBottom:4}}>Dropoff Location</label><input className="fg-inp" style={{fontSize:15}} value={tripTo} onChange={e=>setTripTo(e.target.value)} placeholder="Where did you drop them off?"/></div>
        </div>

        <div className="fgroup">
          <label className="flabel">Rating</label>
          <div className="fl fli" style={{justifyContent:'center',padding:'.75rem 0',gap:2}} onMouseLeave={()=>setHovered(0)}>
            {[1,2,3,4,5].map(i=>{
              const full=display>=i;const half=!full&&display>=i-0.5;
              return(
                <div key={i} style={{position:'relative',width:46,height:46,cursor:'pointer',fontSize:40,lineHeight:'46px',textAlign:'center'}}
                  onClick={e=>handleStarClick(e,i)} onMouseMove={e=>handleStarHover(e,i)}>
                  <span style={{opacity:.22}}>⭐</span>
                  {(full||half)&&<span style={{position:'absolute',left:0,top:0,width:full?'100%':'50%',overflow:'hidden',display:'block'}}>⭐</span>}
                </div>
              );
            })}
          </div>
          {display>0&&<div style={{textAlign:'center',color:'var(--gold)',fontSize:16,fontWeight:600,marginTop:2}}>{display} ★ — {starsLabel(display)}</div>}
        </div>

        <div className="fgroup">
          <label className="flabel">How did they make you feel?</label>
          <div className="fl g8 flw" style={{justifyContent:'center'}}>
            {vibes.map(v=>(
              <button key={v.k} onClick={()=>setVibe(v.k)} style={{padding:'10px 16px',borderRadius:10,border:`1px solid ${vibe===v.k?'rgba(201,170,113,.5)':'var(--border)'}`,background:vibe===v.k?'var(--gold-bg)':'var(--card)',color:vibe===v.k?'var(--gold)':'var(--text)',fontFamily:'var(--font)',fontSize:15,cursor:'pointer',transition:'all .15s'}}>{v.l}</button>
            ))}
          </div>
        </div>

        <div className="fgroup">
          <label className="flabel">Note — describe how they were <span style={{color:'#9060e0',fontWeight:600}}>· AI reads this to adjust score</span></label>
          <textarea className="fg-ta" style={{fontSize:15,minHeight:90}} value={note} onChange={e=>{setNote(e.target.value);if(aiState==='done')setAiState('idle');setAiResult(null);}} placeholder={"Write what happened — good or bad.\nExamples:\n• 'Very polite, asked about my day, tipped well'\n• 'Rude from the start, complained about route, slammed the door'\n• 'Quiet and respectful, no issues'"}/>
          <div className="fl fli g12 mt8">
            <button className="btn btnsm" style={{background:'rgba(144,96,224,.1)',borderColor:'rgba(144,96,224,.3)',color:'#9060e0',opacity:aiState==='loading'?.55:1}} onClick={analyzeNote} disabled={aiState==='loading'}>
              {aiState==='loading'?'Reading note…':aiState==='done'?'↺ Re-analyze note':'◈ Analyze Note'}
            </button>
            {aiState==='done'&&<span className="fxs fg2">✓ Note analyzed — score adjusted</span>}
            {aiState==='error'&&<span className="fxs fr">Analysis failed (no credits?) — stars + vibe used only</span>}
          </div>

          {aiState==='loading'&&(
            <div className="ai-thinking mt8">
              <div className="ai-dots"><div className="ai-dot"/><div className="ai-dot"/><div className="ai-dot"/></div>
              <div><div className="fsm fw5 fp">Reading behavioral signals in your note…</div></div>
            </div>
          )}

          {aiState==='done'&&aiResult&&(
            <div style={{marginTop:'.875rem',background:'rgba(144,96,224,.07)',border:'1px solid rgba(144,96,224,.2)',borderRadius:10,padding:'.875rem 1rem'}}>
              <div className="fl fli flb mb10">
                <span className="ai-badge">◈ AI NOTE ANALYSIS</span>
                <span className={`conf-badge ${confClass(aiResult.confidence)}`}>{aiResult.confidence} confidence</span>
              </div>
              {aiResult.summary&&<div className="fsm mb10" style={{lineHeight:1.6,color:'var(--text)'}}>{aiResult.summary}</div>}
              <div className="fl fli flb mb8">
                <span className="fxs fd">Score adjustment from note</span>
                <span className="fm fw6" style={{color:aiResult.score_adjustment>0?'#4dbf72':aiResult.score_adjustment<0?'#e85555':'#6a6a8a',fontSize:15}}>{aiResult.score_adjustment>0?'+':''}{aiResult.score_adjustment} pts</span>
              </div>
              {aiResult.red_flags?.length>0&&(
                <div className="mb8"><div className="fxs fd mb4">Red flags detected from note</div><div className="fl g4 flw">{aiResult.red_flags.map((f,i)=><span key={i} className="tag tag-r on" style={{fontSize:11}}>{f}</span>)}</div></div>
              )}
              {aiResult.green_flags?.length>0&&(
                <div><div className="fxs fd mb4">Green flags detected from note</div><div className="fl g4 flw">{aiResult.green_flags.map((f,i)=><span key={i} className="tag tag-g on" style={{fontSize:11}}>{f}</span>)}</div></div>
              )}
              {aiResult.score_adjustment!==0&&(
                <div className="fxs fd mt8" style={{fontStyle:'italic'}}>Stars gave {starsToScore(stars)}/10 base → note {aiResult.score_adjustment>0?'raised':'lowered'} it to {Math.max(1,Math.min(10,starsToScore(stars)+Math.round(aiResult.score_adjustment/10*2)))}/10</div>
              )}
            </div>
          )}
        </div>

        <div className="fgroup">
          <label className="flabel">Color</label>
          <div className="fl g8 flw">{COLORS.map(c=><div key={c} className={`cswatch${color===c?' on':''}`} style={{background:c}} onClick={()=>setColor(c)}/>)}</div>
        </div>

        <div className="fl g12 mt16">
          <button className="btn btnp" style={{flex:1,justifyContent:'center',padding:'.7rem',fontSize:16}} onClick={handleSave}>Save ✓</button>
          <button className="btn" onClick={onCancel}>Cancel</button>
        </div>
      </div>
    </div>
  );
}


/* ══ MAIN APP ════════════════════════════════════════════ */
function MainApp({user,onSignOut}){
  const[people,setPeople]=useState([]);
  const[view,setView]=useState('dashboard');
  const[activeId,setActiveId]=useState(null);
  const[loaded,setLoaded]=useState(false);
  const[confirmId,setConfirmId]=useState(null);
  const[syncState,setSyncState]=useState('idle');
  useEffect(()=>{loadData(user.id).then(d=>{setPeople(d&&Array.isArray(d)&&d.length>0?d:SAMPLES);setLoaded(true);});},[user.id]);
  const saveRef=React.useRef(null);
  useEffect(()=>{
    if(!loaded)return;
    setSyncState('syncing');clearTimeout(saveRef.current);
    saveRef.current=setTimeout(async()=>{await saveData(people,user.id);setSyncState('synced');setTimeout(()=>setSyncState('idle'),2000);},1200);
  },[people,loaded]);
  const active=useMemo(()=>people.find(p=>p.id===activeId),[people,activeId]);
  const confirmPerson=useMemo(()=>people.find(p=>p.id===confirmId),[people,confirmId]);
  const go=(v,id=null)=>{setView(v);if(id)setActiveId(id);};
  const back=()=>{setView('dashboard');setActiveId(null);};
  const savePerson=p=>{setPeople(prev=>{const i=prev.findIndex(x=>x.id===p.id);return i>=0?prev.map(x=>x.id===p.id?p:x):[...prev,p];});setActiveId(p.id);setView('profile');};
  const saveQuickRate=p=>{setPeople(prev=>[...prev,p]);setView('dashboard');};
  const saveInteraction=(it,newR,newG)=>{setPeople(prev=>prev.map(p=>p.id!==activeId?p:{...p,interactions:[...(p.interactions||[]),it],red_flags:[...new Set([...(p.red_flags||[]),...newR])],green_flags:[...new Set([...(p.green_flags||[]),...newG])],updated:new Date().toISOString()}));setView('profile');};
  const updatePatterns=pats=>{setPeople(prev=>prev.map(p=>p.id!==activeId?p:{...p,patterns:pats,updated:new Date().toISOString()}));};
  const handleDelete=()=>{setPeople(prev=>prev.filter(p=>p.id!==confirmId));setConfirmId(null);setView('dashboard');setActiveId(null);};
  const syncLabel=syncState==='syncing'?'Saving…':syncState==='synced'?'Saved':'';
  return(
    <div className="app">
      <div className="hdr">
        <div className="logo" onClick={back}>
          <div className="logobadge"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="var(--gold)" strokeWidth="1.4"><polygon points="8,1.5 14.5,5 14.5,11 8,14.5 1.5,11 1.5,5"/><circle cx="8" cy="8" r="2.2" fill="var(--gold)" stroke="none"/></svg></div>
          <div><div className="logotitle">Relationship Intelligence</div><div className="logosub">Behavioral System · v2.1</div></div>
        </div>
        <div className="fl fli g12">
          {syncLabel&&<div className="fl fli g6"><div className={`sync-dot${syncState==='syncing'?' syncing':''}`}/><span className="fxs fd">{syncLabel}</span></div>}
          {view!=='dashboard'&&view!=='add'&&view!=='quickrate'&&<button className="btn btnsm" onClick={back}>← Back</button>}
          {view==='dashboard'&&<button className="btn btnsm" style={{background:'rgba(77,191,114,.1)',borderColor:'rgba(77,191,114,.3)',color:'var(--green)'}} onClick={()=>setView('quickrate')}>⭐ Quick Rate</button>}
          {view==='dashboard'&&<button className="btn btnp btnsm" onClick={()=>go('add')}>+ Add</button>}
          <button className="btn btnsm" style={{color:'var(--text2)',fontSize:11}} onClick={onSignOut} title={user.email}>Sign Out</button>
        </div>
      </div>
      <div className="main">
        {!loaded&&<SplashScreen/>}
        {loaded&&view==='dashboard'&&<Dashboard people={people} onSelect={id=>go('profile',id)} onAdd={()=>go('add')}/>}
        {loaded&&view==='profile'&&active&&<Profile person={active} onBack={back} onEdit={()=>setView('edit')} onLog={()=>setView('log')} onAskDelete={()=>setConfirmId(activeId)} onUpdatePatterns={updatePatterns} onSaveDefense={(correctedScore,situation,result)=>{setPeople(prev=>prev.map(p=>p.id!==activeId?p:{...p,scores:{...p.scores,...Object.fromEntries(Object.entries(result.category_scores||{}).map(([k,v])=>[k.replace('_and_','_').replace('respect_and_boundaries','respect'),v.score]))},defense_log:[...((p.defense_log||[])),{date:new Date().toISOString(),situation,initial_score:sc,corrected_score:correctedScore,result}],notes:p.notes?p.notes+'\n\n[Defense] '+situation:'[Defense] '+situation,updated:new Date().toISOString()}));}}/>}
        {loaded&&view==='add'&&<AddEdit initial={null} onSave={savePerson} onCancel={back}/>}
        {loaded&&view==='edit'&&active&&<AddEdit initial={active} onSave={savePerson} onCancel={()=>setView('profile')}/>}
        {loaded&&view==='log'&&active&&<LogInteraction person={active} onSave={saveInteraction} onCancel={()=>setView('profile')}/>}
        {loaded&&view==='quickrate'&&<QuickRate onSave={saveQuickRate} onCancel={back}/>}
      </div>
      <div style={{borderTop:'1px solid var(--border)',padding:'.75rem 0',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0,paddingBottom:'calc(.75rem + var(--safe-bot))'}}>
        <span className="fxs fd">Data syncs across all your devices · AI-powered digital analysis</span>
        <span className="fxs fm fd">v2.1 · {user.email}</span>
      </div>
      {confirmId&&confirmPerson&&<ConfirmModal name={confirmPerson.name} onConfirm={handleDelete} onCancel={()=>setConfirmId(null)}/>}
    </div>
  );
}

/* ══ ROOT APP ════════════════════════════════════════════ */
function App(){
  const[user,setUser]=useState(null);const[authChecked,setAuthChecked]=useState(false);
  useEffect(()=>{
    if(!isConfigured){setAuthChecked(true);return;}
    sb.auth.getSession().then(({data:{session}})=>{setUser(session?.user??null);setAuthChecked(true);});
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>{setUser(session?.user??null);});
    return()=>subscription.unsubscribe();
  },[]);
  if(!isConfigured)return<SetupScreen/>;
  if(!authChecked)return<SplashScreen/>;
  if(!user)return<AuthScreen onSuccess={()=>sb.auth.getSession().then(({data:{session}})=>setUser(session?.user??null))}/>;
  return<MainApp user={user} onSignOut={async()=>{await dbSignOut();setUser(null);}}/>;
}

createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
